[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-bench"
version = "0.1.0"
description = "Surrogate benchmark library"
requires-python = ">=3.10"
dependencies = [
    "autogluon==1.5.0",
    "xgboost==3.1.3",
    "lightgbm==4.6.0",
    "scikit-learn==1.7.2",
    "tabpfn==6.4.1",
    "matplotlib",
    "seaborn",
    "torch==2.9.1",
    "tqdm"
]

[tool.setuptools.packages.find]
include = [
    "surrogate",
    "surrogate.*"
]

exclude = [
    "surrogate.results",
    "surrogate.plots"
]

[tool.setuptools.package-data]
"surrogate" = ["new_surrogate_data/*.csv"]