##
## Config for Hyperparameter Optimization with NePS.
## 
## This config demonstrates how to define hyperparameter ranges that NePS
## will search over. Add a 'neps_search_space' section with the parameters
## you want to optimize.
##

deterministic: False
seed: 1996

trainset_path: "/work/dlclarge2/sermaxha-scan_thesis/scan_llm_bench/data/data/slimpajama/preprocessed-gpt2/train"
vocab_size: 50277
seq_len: 2048
sampler: 'stateful_random'
sampler_seed: 1996
num_workers: 4

eval: True
validset_path: "/work/dlclarge2/sermaxha-scan_thesis/scan_llm_bench/data/data/slimpajama/preprocessed-gpt2/validation"
valid_tokens: 999900
eval_every_steps: 500

model: 'transformer'
d_model: 512
mlp_class: 'glu'
expand: '8/3'
n_layers: 12
n_heads: 8
rms_norm: True
tie_embeddings: True
torch_compile: True

allow_tf32: True

n_tokens: 1000000000

# For 1B tokens with batch_size=256, seq_len=2048: 1B / (2048 * 256) = ~1907 steps
steps_budget: 1907


micro_batch_size: 16
grad_accumulation_steps: 16

# Auto batch size tuning: probe descending micro_batch_size values to find
# the largest that fits in GPU memory. Set to False to disable.
auto_batch_size: True
# Optional explicit list of batch sizes to try (descending order).
# If not set, auto-generates by halving micro_batch_size down to 1.
# batch_sizes: [32, 16, 8, 4]
batch_sizes: null


dtype: 'bfloat16'

optim: 'adamw'
fused_optim: True 
lr: 3.0e-3 
weight_decay: 1.0e-1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

scheduler: 'wsd'
warmup_steps: 0.05  
cooldown_steps: 0.2  
lr_start: 0.0
lr_end: 0.0
lr_end_pct: null

log_every_steps: 50
print_progress: True

use_wandb: True  
wandb_project: 'scan_llm_bench'
wandb_dir: '/work/dlclarge2/sermaxha-scan_thesis/scan_llm_bench/wandb'
wandb_run_name: 'NePS_Slimapajama'

exp_name: 'NePS_Slimapajama'
out_dir: '/work/dlclarge2/sermaxha-scan_thesis/scan_llm_bench/checkpoints'
over_write: False 

resume: False
resume_step: null
resume_exp_name: null

save_last_checkpoint: True       
save_intermediate_checkpoints: True
save_every_steps: 2000  


# NePS Search Space Definition
# Define the hyperparameters you want NePS to search over.
# Supported types:
#   - float: continuous values (use 'log: true' for log-scale)
#   - int: integer values
#   - categorical: discrete choices
#   - constant: fixed value (useful for ablations)
#
# Each parameter defined here will OVERRIDE the corresponding value
# in the base config above during training.

neps_search_space:
  lr:
    type: float
    lower: 1.0e-5
    upper: 1.0e-1
    log: true
    # default: 3.0e-3

  weight_decay:
    type: float
    lower: 1.0e-3
    upper: 0.2
    log: true
    # default: 1.0e-1

  d_model:
    type: int
    lower: 1
    upper: 16

  n_layers:
    type: int
    lower: 1
    upper: 24

  n_heads:
    type: int
    lower: 1
    upper: 8

  beta1:
    type: float
    lower: 0.8
    upper: 0.99
    log: true
    # default: 0.9

  beta2:
    type: float
    lower: 0.9
    upper: 0.999
    log: true
    # default: 0.95

  warmup_steps:
    type: float
    lower: 0
    upper: 0.3
    log: false
    # default: 0.05

  cooldown_steps: 
    type: float
    lower: 0
    upper: 0.2
    log: false
    # default: 0.1

  n_tokens:
    type: int
    lower: 50000000   # 50M tokens
    upper: 5000000000  # 5B tokens
    log: true
    # default: 100000000  # 100M tokens
